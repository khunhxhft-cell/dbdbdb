<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سایت من</title>
  <style>
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f3f6fb;
      color: #243047;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    .card {
      width: min(90%, 520px);
      box-sizing: border-box;
      padding: 40px 28px;
      text-align: center;
      background: white;
      border-radius: 18px;
      box-shadow: 0 10px 30px #1b35551a;
    }
    h1 { color: #2864c5; }
    p { line-height: 2; }
    a {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 22px;
      color: white;
      background: #2864c5;
      text-decoration: none;
      border-radius: 9px;
    }
    a:hover { background: #194b9b; }
  </style>
</head>
<body>
  <main class="card">
    <h1>به سایت من خوش آمدید!</h1>
    <p>این اولین سایت اینترنتی من است.</p>
    <a href="https://github.com/" target="_blank" rel="noopener noreferrer">
      ورود به گیت‌هاب
    </a>
  </main>
</body>
</html>
